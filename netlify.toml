[build]
  publish = "frontend"

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "*"
    Access-Control-Allow-Methods = "*"

# Forward API calls to active backend
[[redirects]]
  from = "/api/*"
  to = "https://ten-houses-itch.loca.lt/api/:splat"
  status = 200
  force = true

# Forward uploaded complaint images to active backend
[[redirects]]
  from = "/uploads/*"
  to = "https://ten-houses-itch.loca.lt/uploads/:splat"
  status = 200
  force = true
