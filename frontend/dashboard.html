<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citizen Dashboard - SmartCivic AI</title>
    <link rel="stylesheet" href="chatbot.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #f8fafc;
            color: #1e293b;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 60%, #0284c7 100%);
            color: white;
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(30, 58, 138, 0.15);
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-brand h2 {
            font-size: 22px;
            font-weight: 800;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .admin-link-btn {
            background: #f59e0b;
            color: #78350f;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13.5px;
            cursor: pointer;
            display: none; /* Shown dynamically if role is admin */
            transition: all 0.2s;
        }

        .admin-link-btn:hover {
            background: #d97706;
            color: white;
        }

        .report-header-btn {
            background: white;
            color: #1e3a8a;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 13.5px;
            transition: all 0.2s;
        }

        .report-header-btn:hover {
            background: #eff6ff;
            transform: translateY(-1px);
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13.5px;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background: #ef4444;
            border-color: #ef4444;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 35px 25px 60px;
        }

        .welcome {
            margin-bottom: 28px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 16px;
        }

        .welcome h1 {
            font-size: 28px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 6px;
        }

        .welcome p {
            color: #64748b;
            font-size: 15px;
        }

        /* Stats Cards */
        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 35px;
        }

        .card {
            background: white;
            padding: 22px 26px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
            border: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-info h3 {
            color: #64748b;
            font-size: 13.5px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .card-info .number {
            font-size: 32px;
            font-weight: 800;
            color: #0f172a;
        }

        .card-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .card.total .card-icon { background: #e0f2fe; color: #0284c7; }
        .card.pending .card-icon { background: #fef3c7; color: #d97706; }
        .card.progress .card-icon { background: #e0e7ff; color: #4338ca; }
        .card.resolved .card-icon { background: #dcfce7; color: #16a34a; }

        /* Complaints Section */
        .complaints-section {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
            border: 1px solid #e2e8f0;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .section-header h2 {
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
        }

        /* Complaint Item Card */
        .complaint-card {
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 20px;
            background: #ffffff;
            transition: all 0.2s;
        }

        .complaint-card:hover {
            border-color: #cbd5e1;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
        }

        .complaint-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .complaint-title-group h3 {
            font-size: 18px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 4px;
        }

        .complaint-id-tag {
            font-size: 12px;
            font-family: monospace;
            background: #f1f5f9;
            color: #475569;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 600;
        }

        .status-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-pending { background: #fef3c7; color: #b45309; }
        .status-progress { background: #dbeafe; color: #1d4ed8; }
        .status-resolved { background: #dcfce7; color: #15803d; }

        .complaint-main {
            display: flex;
            gap: 20px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .complaint-photo {
            width: 140px;
            height: 110px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .complaint-photo:hover {
            transform: scale(1.03);
        }

        .complaint-body {
            flex: 1;
            min-width: 250px;
        }

        .complaint-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 12px;
            background: #f8fafc;
            padding: 14px;
            border-radius: 10px;
        }

        .grid-item span {
            font-size: 11px;
            color: #64748b;
            text-transform: uppercase;
            font-weight: 600;
            display: block;
            margin-bottom: 2px;
        }

        .grid-item strong {
            font-size: 13.5px;
            color: #1e293b;
        }

        .description-text {
            font-size: 14px;
            color: #334155;
            line-height: 1.6;
            margin-bottom: 14px;
        }

        /* Stepper Lifecycle Progress */
        .lifecycle-stepper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 20px 0 16px;
            padding: 14px 20px;
            background: #f1f5f9;
            border-radius: 12px;
            position: relative;
        }

        .step {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12.5px;
            font-weight: 600;
            color: #94a3b8;
            z-index: 2;
        }

        .step.active {
            color: #1d4ed8;
        }

        .step.done {
            color: #16a34a;
        }

        .step-circle {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #cbd5e1;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
        }

        .step.active .step-circle { background: #2563eb; }
        .step.done .step-circle { background: #22c55e; }

        /* Rating Stars for Resolved */
        .rating-box {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            padding: 12px 18px;
            border-radius: 10px;
            margin-top: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .rating-stars {
            display: flex;
            gap: 6px;
        }

        .star-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #cbd5e1;
            transition: color 0.15s;
        }

        .star-btn.rated,
        .star-btn:hover {
            color: #eab308;
        }

        /* Lightbox Image Modal */
        .lightbox-modal {
            display: none;
            position: fixed;
            z-index: 99999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            align-items: center;
            justify-content: center;
        }
        .lightbox-modal.show { display: flex; }
        .lightbox-img {
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 36px;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .cards { grid-template-columns: repeat(2, 1fr); }
            header { padding: 14px 20px; }
            .container { padding: 20px 15px; }
        }
    </style>
</head>

<body>

<header>
    <div class="header-brand">
        <span style="font-size:26px;">🏙️</span>
        <h2 data-i18n="brand_name">SmartCivic AI</h2>
    </div>

    <div class="header-actions">
        <div id="langSelectorBox"></div>
        <button id="adminPortalBtn" class="admin-link-btn" onclick="goToAdminPortal()" data-i18n="nav_admin_portal">
            ⚙️ Admin Portal
        </button>
        <button class="report-header-btn" onclick="reportIssue()" data-i18n="nav_report_issue">
            + Report Issue
        </button>
        <button class="logout-btn" onclick="logout()" data-i18n="nav_logout">
            Logout
        </button>
    </div>
</header>

<div class="container">

    <div class="welcome">
        <div>
            <h1 id="welcomeMessage">Welcome, Citizen</h1>
            <p data-i18n="dash_subtext">Track your reported issues, municipal assignments, and resolution progress in real-time.</p>
        </div>
        <button class="report-header-btn" style="background:#1e3a8a;color:white;" onclick="reportIssue()" data-i18n="dash_new_complaint">
            + Report New Issue
        </button>
    </div>

    <!-- Quick Stats Cards -->
    <div class="cards">
        <div class="card total">
            <div class="card-info">
                <h3 data-i18n="stat_total">Total Reports</h3>
                <div class="number" id="totalReports">0</div>
            </div>
            <div class="card-icon">📋</div>
        </div>

        <div class="card pending">
            <div class="card-info">
                <h3 data-i18n="stat_pending">Pending</h3>
                <div class="number" id="pendingReports">0</div>
            </div>
            <div class="card-icon">⏳</div>
        </div>

        <div class="card progress">
            <div class="card-info">
                <h3 data-i18n="stat_progress">In Progress</h3>
                <div class="number" id="progressReports">0</div>
            </div>
            <div class="card-icon">⚡</div>
        </div>

        <div class="card resolved">
            <div class="card-info">
                <h3 data-i18n="stat_resolved">Resolved</h3>
                <div class="number" id="resolvedReports">0</div>
            </div>
            <div class="card-icon">✓</div>
        </div>
    </div>

    <!-- Complaints Container -->
    <div class="complaints-section">
        <div class="section-header">
            <h2 data-i18n="dash_my_complaints">My Reported Complaints</h2>
            <span data-i18n="dash_updates_hint" style="font-size:13px;color:#64748b;">Updates automatically from SmartCity Control Room</span>
        </div>

        <div id="complaintsList">
            <div data-i18n="msg_loading" style="padding:40px;text-align:center;color:#64748b;">Loading your complaints...</div>
        </div>
    </div>

</div>

<!-- Photo Lightbox Modal -->
<div id="lightboxModal" class="lightbox-modal" onclick="closeLightbox()">
    <span class="lightbox-close">&times;</span>
    <img id="lightboxImg" class="lightbox-img" src="" alt="Enlarged photo evidence">
</div>

<script src="i18n.js"></script>
<script src="chatbot.js"></script>

<script>
const user = JSON.parse(localStorage.getItem("user"));
if (!user) {
    window.location.href = "login.html";
}

function updateWelcomeMessage() {
    const prefix = (typeof i18n !== "undefined" && i18n.t) ? i18n.t("welcome_prefix") : "Welcome";
    document.getElementById("welcomeMessage").textContent = `${prefix}, ${user.name}`;
}
updateWelcomeMessage();

// Show Admin Portal Button if user is an Administrator
if (user.role === "admin") {
    const adminBtn = document.getElementById("adminPortalBtn");
    if (adminBtn) adminBtn.style.display = "inline-block";
}

function goToAdminPortal() {
    window.location.href = "admin.html";
}

function reportIssue() {
    window.location.href = "report.html";
}

function logout() {
    localStorage.removeItem("user");
    window.location.href = "login.html";
}

// Lightbox modal helpers
function openLightbox(url) {
    const modal = document.getElementById("lightboxModal");
    const img = document.getElementById("lightboxImg");
    img.src = url;
    modal.classList.add("show");
}

function closeLightbox() {
    document.getElementById("lightboxModal").classList.remove("show");
}

// Rating submission helper
const API_BASE = (window.location.protocol === "file:" || window.location.port === "3000") ? "http://localhost:5000" : "";

async function submitRating(complaintId, rating) {
    try {
        const res = await fetch(`${API_BASE}/api/complaints/${complaintId}/rating`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ rating: rating })
        });
        if (res.ok) {
            alert(`Thank you! You rated resolution ${rating} out of 5 stars.`);
            loadMyComplaints();
        }
    } catch (e) {
        console.error("Rating error:", e);
    }
}

async function loadMyComplaints() {
    const list = document.getElementById("complaintsList");

    try {
        const response = await fetch(`${API_BASE}/api/complaints/user/${user.id}`);
        const complaints = await response.json();

        if (!response.ok) {
            throw new Error("Failed to load complaints");
        }

        let pending = 0;
        let progress = 0;
        let resolved = 0;

        complaints.forEach(complaint => {
            if (complaint.status === "Pending") pending++;
            if (complaint.status === "In Progress") progress++;
            if (complaint.status === "Resolved") resolved++;
        });

        document.getElementById("totalReports").textContent = complaints.length;
        document.getElementById("pendingReports").textContent = pending;
        document.getElementById("progressReports").textContent = progress;
        document.getElementById("resolvedReports").textContent = resolved;

        list.innerHTML = "";

        if (complaints.length === 0) {
            const emptyTitle = (typeof i18n !== "undefined" && i18n.t) ? i18n.t("dash_empty_title") : "No complaints submitted yet";
            const emptyDesc = (typeof i18n !== "undefined" && i18n.t) ? i18n.t("dash_empty_desc") : "Spot an issue in your neighborhood? Click 'Report Issue' to notify city authorities.";
            list.innerHTML = `
                <div style="text-align:center;padding:50px 20px;color:#64748b;">
                    <div style="font-size:42px;margin-bottom:12px;">🌱</div>
                    <h3>${emptyTitle}</h3>
                    <p style="margin-top:6px;">${emptyDesc}</p>
                </div>
            `;
            return;
        }

        complaints.forEach(complaint => {
            let statusClass = "status-pending";
            let step1Done = true;
            let step2Done = complaint.department && complaint.department !== "Not Assigned";
            let step3Done = complaint.status === "In Progress" || complaint.status === "Resolved";
            let step4Done = complaint.status === "Resolved";

            if (complaint.status === "In Progress") statusClass = "status-progress";
            if (complaint.status === "Resolved") statusClass = "status-resolved";

            const rawPriority = complaint.priority || "Medium";
            const displayPriority = (typeof i18n !== "undefined" && i18n.translatePriority) ? i18n.translatePriority(rawPriority) : rawPriority;
            const rawCategory = complaint.category || "Other";
            const displayCategory = (typeof i18n !== "undefined" && i18n.translateCategory) ? i18n.translateCategory(rawCategory) : rawCategory;
            const rawDepartment = complaint.department || "Not Assigned";
            const displayDepartment = (typeof i18n !== "undefined" && i18n.translateDepartment) ? i18n.translateDepartment(rawDepartment) : rawDepartment;
            const rawStatus = complaint.status || "Pending";
            const displayStatus = (typeof i18n !== "undefined" && i18n.translateStatus) ? i18n.translateStatus(rawStatus) : rawStatus;

            // Photo HTML if present
            let photoHtml = "";
            if (complaint.imageUrl) {
                const fullImgUrl = complaint.imageUrl.startsWith("http") ? complaint.imageUrl : `${API_BASE}${complaint.imageUrl}`;
                const clickEnlargeTxt = (typeof i18n !== "undefined" && i18n.t) ? i18n.t("card_click_enlarge") : "🔍 Click to enlarge";
                photoHtml = `
                    <div>
                        <img 
                            src="${fullImgUrl}" 
                            class="complaint-photo" 
                            alt="Photo Evidence"
                            title="Click to view full photo"
                            onclick="openLightbox('${fullImgUrl}')"
                        />
                        <div style="font-size:11px;color:#64748b;text-align:center;margin-top:4px;">${clickEnlargeTxt}</div>
                    </div>
                `;
            }

            // GPS link or coordinates
            let mapLocationLink = complaint.location;
            if (complaint.latitude && complaint.longitude) {
                const viewMapShort = (typeof i18n !== "undefined" && i18n.t) ? i18n.t("card_view_map_short") : "(View Map ↗)";
                mapLocationLink = `
                    <a href="https://www.openstreetmap.org/?mlat=${complaint.latitude}&mlon=${complaint.longitude}#map=16/${complaint.latitude}/${complaint.longitude}" target="_blank" style="color:#0284c7;text-decoration:none;font-weight:600;">
                        📍 ${complaint.location} ${viewMapShort}
                    </a>
                `;
            }

            // Credibility & Fraud Notice
            const credLabel = (typeof i18n !== "undefined" && i18n.t) ? i18n.t("th_credibility") : "AI Credibility";
            let credibilityHtml = `
                <div class="grid-item">
                    <span>${credLabel}</span>
                    <strong style="color:${complaint.credibilityScore >= 70 ? '#16a34a' : '#ea580c'};">
                        🛡️ ${complaint.credibilityScore || 80}/100
                    </strong>
                </div>
            `;

            let flagNotice = "";
            if (complaint.isFlagged) {
                const modPrefix = (typeof i18n !== "undefined" && i18n.t) ? i18n.t("moderation_desk_prefix") : "Moderation Desk:";
                flagNotice = `
                    <div style="background:#fffbeb;border:1px solid #fde68a;color:#b45309;padding:8px 12px;border-radius:8px;font-size:12.5px;margin-bottom:12px;">
                        ⚠️ <strong>${modPrefix}</strong> ${complaint.flagReason || "Under automated duplicate/spam review."}
                    </div>
                `;
            }

            // Rating Box for Resolved issues
            let ratingHtml = "";
            if (complaint.status === "Resolved") {
                const currentRating = complaint.citizenRating || 0;
                let stars = "";
                for (let i = 1; i <= 5; i++) {
                    const rated = i <= currentRating ? "rated" : "";
                    stars += `<button class="star-btn ${rated}" onclick="submitRating('${complaint._id}', ${i})">★</button>`;
                }

                const resolvedNoteTxt = (typeof i18n !== "undefined" && i18n.t) ? i18n.t("msg_resolved_note") : "✓ Issue Resolved by Municipal Crew";
                const rateResTxt = (typeof i18n !== "undefined" && i18n.t) ? i18n.t("msg_rate_resolution") : "Rate resolution:";
                const noteTxt = (typeof i18n !== "undefined" && i18n.t) ? i18n.t("label_note") : "Note:";

                ratingHtml = `
                    <div class="rating-box">
                        <div>
                            <strong style="color:#166534;font-size:13.5px;">${resolvedNoteTxt}</strong>
                            ${complaint.resolutionNote ? `<p style="font-size:12.5px;color:#334155;margin-top:3px;">${noteTxt} ${complaint.resolutionNote}</p>` : ""}
                        </div>
                        <div style="display:flex;align-items:center;gap:8px;">
                            <span style="font-size:12.5px;color:#64748b;">${rateResTxt}</span>
                            <div class="rating-stars">${stars}</div>
                        </div>
                    </div>
                `;
            }

            const catLabel = (typeof i18n !== "undefined" && i18n.t) ? i18n.t("th_category") : "Category";
            const prioLabel = (typeof i18n !== "undefined" && i18n.t) ? i18n.t("th_priority") : "Priority";
            const deptLabel = (typeof i18n !== "undefined" && i18n.t) ? i18n.t("th_department") : "Department";
            const locLabel = (typeof i18n !== "undefined" && i18n.t) ? i18n.t("th_location") : "Location";
            const stepReported = (typeof i18n !== "undefined" && i18n.t) ? i18n.t("step_reported") : "Reported";
            const stepAssigned = (typeof i18n !== "undefined" && i18n.t) ? i18n.t("step_assigned") : "Assigned Dept";
            const stepProgress = (typeof i18n !== "undefined" && i18n.t) ? i18n.t("stat_progress") : "In Progress";
            const stepResolved = (typeof i18n !== "undefined" && i18n.t) ? i18n.t("stat_resolved") : "Resolved";

            const card = document.createElement("div");
            card.className = "complaint-card";
            card.innerHTML = `
                <div class="complaint-top">
                    <div class="complaint-title-group">
                        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
                            <span class="complaint-id-tag">${complaint.complaintId || 'SC-2026-N/A'}</span>
                            <span style="font-size:12px;color:#94a3b8;">${new Date(complaint.createdAt).toLocaleDateString()}</span>
                        </div>
                        <h3>${complaint.title}</h3>
                    </div>
                    <span class="status-badge ${statusClass}">${displayStatus.toUpperCase()}</span>
                </div>

                ${flagNotice}

                <div class="complaint-main">
                    ${photoHtml}
                    <div class="complaint-body">
                        <div class="complaint-grid">
                            <div class="grid-item">
                                <span>${catLabel}</span>
                                <strong>${displayCategory}</strong>
                            </div>
                            <div class="grid-item">
                                <span>${prioLabel}</span>
                                <strong style="color:${complaint.priority === 'High' ? '#dc2626' : '#2563eb'};">${displayPriority}</strong>
                            </div>
                            <div class="grid-item">
                                <span>${deptLabel}</span>
                                <strong>${displayDepartment}</strong>
                            </div>
                            <div class="grid-item">
                                <span>${locLabel}</span>
                                <strong>${mapLocationLink}</strong>
                            </div>
                            ${credibilityHtml}
                        </div>

                        <div class="description-text">
                            ${complaint.description}
                        </div>
                    </div>
                </div>

                <!-- Lifecycle Stepper -->
                <div class="lifecycle-stepper">
                    <div class="step ${step1Done ? 'done' : ''}">
                        <div class="step-circle">${step1Done ? '✓' : '1'}</div>
                        <span>${stepReported}</span>
                    </div>
                    <div style="flex:1;height:2px;background:${step2Done ? '#22c55e' : '#cbd5e1'};margin:0 8px;"></div>
                    <div class="step ${step2Done ? 'done' : (step1Done ? 'active' : '')}">
                        <div class="step-circle">${step2Done ? '✓' : '2'}</div>
                        <span>${stepAssigned}</span>
                    </div>
                    <div style="flex:1;height:2px;background:${step3Done ? '#22c55e' : '#cbd5e1'};margin:0 8px;"></div>
                    <div class="step ${step3Done ? 'done' : (complaint.status === 'In Progress' ? 'active' : '')}">
                        <div class="step-circle">${step3Done ? '✓' : '3'}</div>
                        <span>${stepProgress}</span>
                    </div>
                    <div style="flex:1;height:2px;background:${step4Done ? '#22c55e' : '#cbd5e1'};margin:0 8px;"></div>
                    <div class="step ${step4Done ? 'done' : ''}">
                        <div class="step-circle">${step4Done ? '✓' : '4'}</div>
                        <span>${stepResolved}</span>
                    </div>
                </div>

                ${ratingHtml}
            `;

            list.appendChild(card);
        });

    } catch (error) {
        console.error("Dashboard error:", error);
        list.innerHTML = `
            <div style="padding:40px;text-align:center;color:#ef4444;">
                Failed to load complaints. Please make sure the backend server is running on http://localhost:5000.
            </div>
        `;
    }
}

// Re-render complaints and greeting when language changes
window.addEventListener("languageChanged", () => {
    updateWelcomeMessage();
    loadMyComplaints();
});

loadMyComplaints();
</script>
